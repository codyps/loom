name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  schedule:
    - cron: '0 2 * * 0'

env:
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: 1

defaults:
  run:
    shell: bash

jobs:
  # Check formatting
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      run: rustup update stable && rustup default stable
    - name: Check formatting
      run: cargo fmt --all --check

  # This represents the minimum Rust version supported by
  # Loom. Updating this should be done in a dedicated PR.
  #
  # Tests are not run as tests may require newer versions of
  # rust.
  minrust:
    name: minrust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack
      - name: Generate lockfile
        run: cargo generate-lockfile --config 'resolver.incompatible-rust-versions="fallback"'
      - name: Check
        run: cargo hack check --all-features --rust-version

  # Minimal dependency versions
  minimal-dependency-versions:
    name: minimal dependency versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: Install nightly Rust
        run: rustup update nightly
      - name: Set direct dependencies to lowest allowed versions
        run: cargo +nightly update -Z direct-minimal-versions
      - name: Test
        run: cargo test
      - name: Test --features checkpoint
        run: cargo test --features checkpoint
      - name: Test --features futures
        run: cargo test --features futures
      - name: Test --features lock_api
        run: cargo test --features lock_api

  # Stable
  stable:
    name: stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: Test
        run: cargo test
      - name: Test --features checkpoint
        run: cargo test --features checkpoint
      - name: Test --features futures
        run: cargo test --features futures
      - name: Test --features lock_api
        run: cargo test --features lock_api

  # An optimized build checks every program of the litmus corpus, where an
  # unoptimized one checks one in eight.
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: Test --release --all-features
        run: cargo test --release --all-features
      - name: Test --release --all-features, with several workers
        run: cargo test --release --all-features
        env:
          LOOM_WORKERS: 4

  # The same with debug assertions, which hold loom's checks of its own
  # state (the order of `SeqCst` operations being free of cycles, say).
  release-debug-assertions:
    name: release with debug assertions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: Test --release --all-features
        run: cargo test --release --all-features
        env:
          RUSTFLAGS: -Dwarnings -C debug-assertions
          LOOM_LITMUS_SAMPLE: 1

  # check docs
  docs:
    name: build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update nightly && rustup default nightly
      - name: cargo doc
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "--cfg docsrs -Dwarnings"
